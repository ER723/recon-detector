name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov ruff mypy types-PyYAML
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy recon_detector.py
      - name: Run tests with coverage
        run: python -m pytest --cov=recon_detector --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
